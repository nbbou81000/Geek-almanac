name: Wrap Terms

on:
  workflow_dispatch:

jobs:
  wrap:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Wrap all terms files
        run: node wrapTerms.js

      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add terms/
          git diff --staged --quiet || git commit -m "Wrap terms files in {entries: [...]} format"
          git push
